<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" font-family="system-ui, sans-serif" font-size="13">
  <!-- React Frontend (Blue) -->
  <rect x="20" y="60" width="140" height="80" rx="6" fill="#e8f4fc" stroke="#2563eb"/>
  <text x="90" y="85" text-anchor="middle" font-weight="bold">React Frontend</text>
  <text x="90" y="105" text-anchor="middle" font-size="11">web/client/</text>
  <text x="90" y="120" text-anchor="middle" font-size="11">HTTP cURL</text>

  <!-- Express Server (Orange) -->
  <rect x="280" y="20" width="160" height="120" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="50" text-anchor="middle" font-weight="bold">Express API</text>
  <text x="360" y="68" text-anchor="middle" font-size="11">Node.js Server</text>
  <text x="360" y="86" text-anchor="middle" font-size="11">Auth &amp; Routing</text>
  <text x="360" y="104" text-anchor="middle" font-size="11">ex2TcpClient.js</text>
  <text x="360" y="122" text-anchor="middle" font-size="11">REST API</text>

  <!-- In-Memory Data (Purple) -->
  <rect x="280" y="180" width="160" height="60" rx="6" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="360" y="205" text-anchor="middle" font-weight="bold">In-Memory Data</text>
  <text x="360" y="223" text-anchor="middle" font-size="11">Models / Arrays</text>

  <!-- C++ Server (Green) -->
  <rect x="560" y="50" width="140" height="60" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="630" y="75" text-anchor="middle" font-weight="bold">C++ Server (Ex2)</text>
  <text x="630" y="95" text-anchor="middle" font-size="11">Port 8080</text>

  <!-- Arrow from React to Express -->
  <line x1="160" y1="80" x2="280" y2="80" stroke="#374151" marker-end="url(#arrow)"/>
  <text x="220" y="72" text-anchor="middle" font-size="10">HTTP / JSON</text>

  <!-- Arrow from Express to C++ Server -->
  <line x1="440" y1="80" x2="560" y2="80" stroke="#374151" marker-end="url(#arrow)"/>
  <text x="500" y="72" text-anchor="middle" font-size="10">TCP (Product View)</text>

  <!-- Arrow from Express to Data -->
  <line x1="360" y1="140" x2="360" y2="180" stroke="#374151" marker-end="url(#arrow)"/>
  <text x="385" y="165" text-anchor="middle" font-size="10">CRUD</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
