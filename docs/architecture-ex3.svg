<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="system-ui, sans-serif" font-size="13">
  <rect x="20" y="100" width="130" height="70" rx="6" fill="#e8f4fc" stroke="#2563eb"/>
  <text x="85" y="132" text-anchor="middle">HTTP client</text>
  <text x="85" y="150" text-anchor="middle" font-size="11">curl / Postman</text>

  <rect x="200" y="60" width="200" height="150" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="300" y="88" text-anchor="middle" font-weight="bold">Web server (Ex3)</text>
  <text x="300" y="108" text-anchor="middle" font-size="11">Express MVC  web/</text>
  <text x="300" y="126" text-anchor="middle" font-size="11">routes ’ controllers ’ models</text>
  <text x="300" y="144" text-anchor="middle" font-size="11">In-memory JSON API /api/*</text>
  <text x="300" y="162" text-anchor="middle" font-size="11">services/ex2TcpClient</text>

  <rect x="460" y="100" width="150" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="535" y="128" text-anchor="middle">Ex2 TCP server</text>
  <text x="535" y="146" text-anchor="middle" font-size="11">C++  src/ :8080</text>

  <rect x="660" y="100" width="140" height="70" rx="6" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="730" y="128" text-anchor="middle">FileRepository</text>
  <text x="730" y="146" text-anchor="middle" font-size="11">data/users_products.txt</text>

  <line x1="150" y1="135" x2="200" y2="135" stroke="#374151" marker-end="url(#arrow)"/>
  <text x="175" y="125" text-anchor="middle" font-size="10">REST JSON</text>

  <line x1="400" y1="135" x2="460" y2="135" stroke="#374151" marker-end="url(#arrow)"/>
  <text x="430" y="125" text-anchor="middle" font-size="10">TCP lines</text>

  <line x1="610" y1="135" x2="660" y2="135" stroke="#374151" marker-end="url(#arrow)"/>

  <rect x="200" y="240" width="340" height="50" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="370" y="262" text-anchor="middle" font-size="11">Product GET ’ recordProductView(userId, productId) ’ GET userId productId on Ex2</text>
  <text x="370" y="278" text-anchor="middle" font-size="10">Auth header: user-id (from POST /api/tokens login)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
