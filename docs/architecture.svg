<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif" font-size="13">
  <rect x="20" y="40" width="140" height="60" rx="6" fill="#e8f4fc" stroke="#2563eb"/>
  <text x="90" y="75" text-anchor="middle">Python client</text>
  <text x="90" y="92" text-anchor="middle" font-size="11">client.py</text>

  <rect x="280" y="20" width="160" height="100" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="50" text-anchor="middle">TCP accept loop</text>
  <text x="360" y="68" text-anchor="middle" font-size="11">main.cpp</text>
  <text x="360" y="86" text-anchor="middle" font-size="11">SocketLine I/O</text>
  <text x="360" y="104" text-anchor="middle" font-size="11">ProtocolLineIO</text>

  <rect x="280" y="150" width="160" height="110" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="360" y="178" text-anchor="middle">App</text>
  <text x="360" y="196" text-anchor="middle" font-size="11">CommandParser</text>
  <text x="360" y="214" text-anchor="middle" font-size="11">CommandExecutor</text>
  <text x="360" y="232" text-anchor="middle" font-size="11">IInput / IOutput</text>

