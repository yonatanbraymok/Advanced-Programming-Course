services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    stdin_open: true
    tty: true

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Docker network: C++ service hostname is "server", not localhost.
      - EX2_SERVER_HOST=server
      - EX2_SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - MONGODB_URI=mongodb://mongo:27017/wolt
    depends_on:
      - server
      - mongo

volumes:
  mongo_data: